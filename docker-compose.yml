name: api_app

services:
  api:
    build: .
    volumes:
      - ./media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - envs/.env
      - envs/.env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  
  migration:
    build: .
    command: uv run alembic upgrade head
    env_file:
      - envs/.env
      - envs/.env.docker
    depends_on:
      db:
        condition: service_healthy
  
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./media:/usr/share/nginx/html/media:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started
  
  db:
    image: postgres:17
    env_file:
      - envs/.env
      - envs/.env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
  
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
