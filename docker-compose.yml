name: gif_app

services:
  backend:
    build: ./backend
    volumes:
      - ${MEDIA_BASE_PATH}:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
      - envs/.env.docker
    depends_on:
      migration:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
        
  frontend:
    build:
      context: ./frontend
      args:
        VITE_DEV_MODE: ${DEV_MODE}
        VITE_TELEGRAM_BOT_USERNAME: ${BOT_NAME}
    ports:
      - "80:80"
    volumes:
      - ${MEDIA_BASE_PATH}:/usr/share/nginx/html/media:ro
    depends_on:
      - backend
    
  migration:
    build: ./backend
    command: uv run alembic upgrade head
    env_file:
      - .env
      - envs/.env.docker
    depends_on:
      db:
        condition: service_healthy
  
  db:
    image: postgres:17
    env_file:
      - .env
      - envs/.env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
  
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
